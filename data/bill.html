<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tagihan Listrik Bulanan</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .rate-setting {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .rate-setting input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 220px;
        }

        .rate-setting button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .rate-message {
            margin-top: 10px;
            font-weight: bold;
        }

        .chartCard canvas {
            width: 100% !important;
            max-height: 450px;
        }

        .statusItem {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(128,128,128,.2);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <div>
            <h1>TAGIHAN LISTRIK</h1>
            <p>Diagram Tagihan Listrik Perbulan</p>
        </div>

        <div class="clockArea">
            <span id="clock">00:00:00</span>
        </div>
    </header>


    <!-- KEMBALI -->
    <section class="setting">
        <button id="backButton" type="button">
            ← Kembali ke Dashboard
        </button>
    </section>


    <!-- RINGKASAN -->
    <section class="cards">

        <div class="card">
            <h3>Pemakaian Bulan Ini</h3>

            <h2 id="monthlyEnergy">
                0
            </h2>

            <p>kWh</p>
        </div>


        <div class="card">
            <h3>Estimasi Tagihan</h3>

            <h2 id="monthlyBill">
                Rp 0
            </h2>

            <p>Bulan Ini</p>
        </div>


        <div class="card">
            <h3>Tarif Listrik</h3>

            <h2 id="electricityRate">
                Rp 1.500
            </h2>

            <p>per kWh</p>
        </div>

    </section>


    <!-- ATUR TARIF -->
    <section class="setting">

        <h2>Atur Tarif Listrik</h2>

        <div class="rate-setting">

            <input
                id="rateInput"
                type="number"
                min="1"
                step="1"
                placeholder="Contoh: 1500"
            >

            <button
                id="saveRateButton"
                type="button">
                Simpan Tarif
            </button>

        </div>

        <div
            id="rateMessage"
            class="rate-message">
        </div>

    </section>


    <!-- DIAGRAM -->
    <section class="chartCard">

        <h2>
            Diagram Tagihan Listrik Perbulan
        </h2>

        <canvas id="monthlyBillChart"></canvas>

    </section>


    <!-- RIWAYAT -->
    <section class="chartCard">

        <h2>
            Riwayat Tagihan
        </h2>

        <div id="history">
            <p>Belum ada riwayat tagihan.</p>
        </div>

    </section>

</div>


<!-- =====================================================
     LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<script>
'use strict';

/* ========================================================
   KONFIGURASI MQTT
======================================================== */

const MQTT_HOST =
    "wss://l660c516.ala.eu-central-1.emqxsl.com:8084/mqtt";

const MQTT_OPTIONS = {

    username: "smartenergymeter",

    password: "12345678",

    reconnectPeriod: 3000,

    connectTimeout: 10000,

    clean: true

};

const TOPIC_DATA =
    "smartmeter/data";


/* ========================================================
   ELEMENT
======================================================== */

const monthlyEnergyEl =
    document.getElementById("monthlyEnergy");

const monthlyBillEl =
    document.getElementById("monthlyBill");

const electricityRateEl =
    document.getElementById("electricityRate");

const rateInput =
    document.getElementById("rateInput");

const saveRateButton =
    document.getElementById("saveRateButton");

const rateMessage =
    document.getElementById("rateMessage");

const historyEl =
    document.getElementById("history");

const clockEl =
    document.getElementById("clock");

const backButton =
    document.getElementById("backButton");

const chartCanvas =
    document.getElementById("monthlyBillChart");


/* ========================================================
   TARIF LISTRIK
======================================================== */

let electricityRate =
    Number(
        localStorage.getItem("electricityRate")
    );


// Jika belum ada tarif
if (
    !Number.isFinite(electricityRate) ||
    electricityRate <= 0
) {

    electricityRate = 1500;

    localStorage.setItem(
        "electricityRate",
        String(electricityRate)
    );
}


/* ========================================================
   DATA BULANAN
======================================================== */

let monthlyData = {};

try {

    monthlyData =
        JSON.parse(
            localStorage.getItem(
                "monthlyElectricity"
            )
        ) || {};

}
catch(error) {

    console.error(
        "Data bulanan rusak:",
        error
    );

    monthlyData = {};

}


/* ========================================================
   NAMA BULAN
======================================================== */

const monthNames = [

    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"

];


/* ========================================================
   FORMAT RUPIAH
======================================================== */

function formatRupiah(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(
        Number(value) || 0
    );

}


/* ========================================================
   BULAN SEKARANG
======================================================== */

function getCurrentMonthKey() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0")
    );

}


/* ========================================================
   UPDATE INFORMASI BULAN INI
======================================================== */

function updateCurrentBill() {

    const key =
        getCurrentMonthKey();

    const energy =
        Number(
            monthlyData[key] || 0
        );

    const bill =
        energy *
        electricityRate;


    monthlyEnergyEl.textContent =
        energy.toFixed(3);


    monthlyBillEl.textContent =
        formatRupiah(bill);


    electricityRateEl.textContent =
        formatRupiah(
            electricityRate
        );


    rateInput.value =
        electricityRate;

}


/* ========================================================
   PESAN TARIF
======================================================== */

function showRateMessage(
    message,
    success = true
) {

    rateMessage.textContent =
        message;

    rateMessage.style.color =
        success
            ? "#10B981"
            : "#EF4444";

}


/* ========================================================
   SIMPAN TARIF
======================================================== */

function saveRate() {

    const value =
        Number(
            rateInput.value
        );


    // Validasi
    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {

        showRateMessage(
            "Tarif harus lebih dari 0.",
            false
        );

        return;

    }


    if (value > 100000) {

        showRateMessage(
            "Tarif terlalu besar.",
            false
        );

        return;

    }


    // Simpan ke variabel
    electricityRate =
        value;


    // Simpan ke browser
    localStorage.setItem(
        "electricityRate",
        String(electricityRate)
    );


    // Update tampilan
    updateCurrentBill();


    // Update diagram
    createChart();


    // Update riwayat
    showHistory();


    showRateMessage(
        "Tarif berhasil disimpan: " +
        formatRupiah(
            electricityRate
        ) +
        " / kWh",
        true
    );


    console.log(
        "Tarif listrik:",
        electricityRate
    );

}


/* ========================================================
   EVENT TOMBOL TARIF
======================================================== */

if (saveRateButton) {

    saveRateButton.addEventListener(
        "click",
        saveRate
    );

}


/* ========================================================
   ENTER PADA INPUT
======================================================== */

if (rateInput) {

    rateInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                saveRate();

            }

        }
    );

}


/* ========================================================
   TOMBOL KEMBALI
======================================================== */

if (backButton) {

    backButton.addEventListener(
        "click",
        function() {

            window.location.href =
                "index.html";

        }
    );

}


/* ========================================================
   CHART
======================================================== */

let billChart = null;


function createChart() {

    if (!chartCanvas) {

        console.error(
            "Canvas diagram tidak ditemukan."
        );

        return;

    }


    const labels = [];

    const values = [];


    const currentYear =
        new Date().getFullYear();


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        const bill =
            energy *
            electricityRate;


        labels.push(
            monthNames[month]
        );


        values.push(
            bill
        );

    }


    // Hapus chart lama
    if (billChart) {

        billChart.destroy();

        billChart = null;

    }


    billChart =
        new Chart(
            chartCanvas,
            {

                type: "bar",

                data: {

                    labels: labels,

                    datasets: [

                        {

                            label:
                                "Tagihan Listrik",

                            data:
                                values,

                            borderWidth: 1

                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: true,

                    animation: false,

                    scales: {

                        y: {

                            beginAtZero: true,

                            ticks: {

                                callback:
                                function(value) {

                                    return formatRupiah(
                                        value
                                    );

                                }

                            }

                        }

                    },

                    plugins: {

                        tooltip: {

                            callbacks: {

                                label:
                                function(context) {

                                    return formatRupiah(
                                        context.raw
                                    );

                                }

                            }

                        }

                    }

                }

            }
        );

}


/* ========================================================
   RIWAYAT
======================================================== */

function showHistory() {

    if (!historyEl)
        return;


    historyEl.innerHTML = "";


    const currentYear =
        new Date().getFullYear();


    let totalItems = 0;


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        if (
            energy <= 0
        ) {

            continue;

        }


        const bill =
            energy *
            electricityRate;


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "statusItem";


        const monthName =
            document.createElement(
                "strong"
            );

        monthName.textContent =
            monthNames[month];


        const value =
            document.createElement(
                "span"
            );

        value.textContent =
            energy.toFixed(3) +
            " kWh — " +
            formatRupiah(bill);


        item.appendChild(
            monthName
        );

        item.appendChild(
            value
        );


        historyEl.appendChild(
            item
        );


        totalItems++;

    }


    if (
        totalItems === 0
    ) {

        historyEl.innerHTML =
            "<p>Belum ada riwayat tagihan.</p>";

    }

}


/* ========================================================
   SIMPAN ENERGI MQTT
======================================================== */

function saveEnergyFromMQTT(
    energy
) {

    energy =
        Number(energy);


    if (
        !Number.isFinite(energy)
    ) {

        console.error(
            "Energy MQTT tidak valid:",
            energy
        );

        return;

    }


    const key =
        getCurrentMonthKey();


    let startData = {};

    try {

        startData =
            JSON.parse(
                localStorage.getItem(
                    "monthlyEnergyStart"
                )
            ) || {};

    }
    catch(error) {

        startData = {};

    }


    /*
       Jika bulan ini belum mempunyai
       energi awal, simpan energi PZEM
       sebagai titik awal.
    */

    if (
        startData[key] === undefined
    ) {

        startData[key] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );

    }


    const startEnergy =
        Number(
            startData[key]
        );


    let usedEnergy =
        energy -
        startEnergy;


    /*
       Jika PZEM reset,
       jangan menghasilkan nilai negatif.
    */

    if (
        usedEnergy < 0
    ) {

        startData[key] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );


        usedEnergy = 0;

    }


    monthlyData[key] =
        usedEnergy;


    localStorage.setItem(
        "monthlyElectricity",
        JSON.stringify(
            monthlyData
        )
    );


    /*
       Update angka saja.
       Chart TIDAK dibuat ulang
       setiap MQTT message.
    */

    updateCurrentBill();

    showHistory();

}


/* ========================================================
   MQTT
======================================================== */

let mqttClient = null;


function connectMQTT() {

    if (
        typeof mqtt === "undefined"
    ) {

        console.error(
            "Library MQTT tidak ditemukan."
        );

        return;

    }


    console.log(
        "=== BILL MQTT START ==="
    );


    mqttClient =
        mqtt.connect(
            MQTT_HOST,
            MQTT_OPTIONS
        );


    mqttClient.on(
        "connect",
        function() {

            console.log(
                "=== BILL MQTT CONNECTED ==="
            );


            mqttClient.subscribe(
                TOPIC_DATA,
                function(error) {

                    if (error) {

                        console.error(
                            "MQTT SUBSCRIBE ERROR:",
                            error
                        );

                    }
                    else {

                        console.log(
                            "MQTT SUBSCRIBED:",
                            TOPIC_DATA
                        );

                    }

                }
            );

        }
    );


    mqttClient.on(
        "message",
        function(
            topic,
            message
        ) {

            try {

                const data =
                    JSON.parse(
                        message.toString()
                    );


                if (
                    data.energy !== undefined
                ) {

                    saveEnergyFromMQTT(
                        data.energy
                    );

                }

            }
            catch(error) {

                console.error(
                    "MQTT JSON ERROR:",
                    error
                );

            }

        }
    );


    mqttClient.on(
        "error",
        function(error) {

            console.error(
                "BILL MQTT ERROR:",
                error
            );

        }
    );


    mqttClient.on(
        "reconnect",
        function() {

            console.log(
                "BILL MQTT RECONNECTING..."
            );

        }
    );


    mqttClient.on(
        "close",
        function() {

            console.log(
                "BILL MQTT CLOSED"
            );

        }
    );

}


/* ========================================================
   JAM
======================================================== */

function updateClock() {

    if (!clockEl)
        return;


    clockEl.textContent =
        new Date()
            .toLocaleTimeString(
                "id-ID"
            );

}


/* ========================================================
   START
======================================================== */

window.addEventListener(
    "load",
    function() {

        console.log(
            "=== BILL PAGE START ==="
        );


        updateCurrentBill();

        createChart();

        showHistory();

        updateClock();

        connectMQTT();

    }
);


setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>

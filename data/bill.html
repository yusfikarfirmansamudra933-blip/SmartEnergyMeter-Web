<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Tagihan Listrik Bulanan</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div>

            <h1>TAGIHAN LISTRIK</h1>

            <p>Diagram Tagihan Listrik Perbulan</p>

        </div>


        <div class="clockArea">

            <span id="clock">
                00:00:00
            </span>

        </div>

    </header>


    <!-- =====================================================
         KEMBALI
    ====================================================== -->

    <section class="setting">

        <button
            type="button"
            id="backButton"
        >
            ← Kembali ke Dashboard
        </button>

    </section>


    <!-- =====================================================
         RINGKASAN
    ====================================================== -->

    <section class="cards">


        <div class="card">

            <h3>Pemakaian Bulan Ini</h3>

            <h2 id="monthlyEnergy">
                0.000
            </h2>

            <p>kWh</p>

        </div>


        <div class="card">

            <h3>Estimasi Tagihan</h3>

            <h2 id="monthlyBill">
                Rp0
            </h2>

            <p>Bulan Ini</p>

        </div>


        <div class="card">

            <h3>Tarif Listrik</h3>

            <h2 id="electricityRate">
                Rp1.500
            </h2>

            <p>per kWh</p>

        </div>


    </section>


    <!-- =====================================================
         ATUR TARIF
    ====================================================== -->

    <section class="setting">

        <h2>Atur Tarif Listrik</h2>


        <input
            id="rateInput"
            type="number"
            min="1"
            step="1"
            placeholder="Contoh: 1500"
            autocomplete="off"
        >


        <button
            id="saveRateButton"
            type="button"
        >
            Simpan Tarif
        </button>


        <p id="rateMessage"></p>

    </section>


    <!-- =====================================================
         DIAGRAM
    ====================================================== -->

    <section class="chartCard">

        <h2>
            Diagram Tagihan Listrik Perbulan
        </h2>


        <p>
            Data diagram diperbarui setiap 5 menit.
        </p>


        <canvas id="monthlyBillChart"></canvas>

    </section>


    <!-- =====================================================
         RIWAYAT
    ====================================================== -->

    <section class="chartCard">

        <h2>
            Riwayat Tagihan
        </h2>


        <div id="history">

            <p>Belum ada riwayat tagihan.</p>

        </div>

    </section>


</div>


<!-- =========================================================
     CHART.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- =========================================================
     MQTT
========================================================= -->

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<script>

/* ==========================================================
   KONFIGURASI MQTT
========================================================== */

const MQTT_HOST =
    "wss://l660c516.ala.eu-central-1.emqxsl.com:8084/mqtt";


const MQTT_OPTIONS = {

    username: "smartenergymeter",

    password: "12345678",

    reconnectPeriod: 3000,

    connectTimeout: 10000,

    clean: true

};


const TOPIC_DATA =
    "smartmeter/data";


/* ==========================================================
   ELEMENT
========================================================== */

const monthlyEnergyEl =
    document.getElementById("monthlyEnergy");


const monthlyBillEl =
    document.getElementById("monthlyBill");


const electricityRateEl =
    document.getElementById("electricityRate");


const rateInput =
    document.getElementById("rateInput");


const saveRateButton =
    document.getElementById("saveRateButton");


const rateMessage =
    document.getElementById("rateMessage");


const historyEl =
    document.getElementById("history");


const clockEl =
    document.getElementById("clock");


const backButton =
    document.getElementById("backButton");


/* ==========================================================
   TARIF
========================================================== */

let electricityRate =
    Number(
        localStorage.getItem("electricityRate")
    );


/*
   Jika belum pernah mempunyai tarif,
   gunakan 1500.
*/

if (
    !Number.isFinite(electricityRate) ||
    electricityRate <= 0
) {

    electricityRate = 1500;

    localStorage.setItem(
        "electricityRate",
        String(electricityRate)
    );

}


/* ==========================================================
   DATA BULANAN
========================================================== */

let monthlyData;

try {

    monthlyData =
        JSON.parse(
            localStorage.getItem(
                "monthlyElectricity"
            )
        ) || {};

}
catch {

    monthlyData = {};

}


/* ==========================================================
   NAMA BULAN
========================================================== */

const monthNames = [

    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"

];


/* ==========================================================
   FORMAT RUPIAH
========================================================== */

function formatRupiah(value) {

    return new Intl.NumberFormat(
        "id-ID",
        {

            style: "currency",

            currency: "IDR",

            maximumFractionDigits: 0

        }
    ).format(value);

}


/* ==========================================================
   BULAN SEKARANG
========================================================== */

function getCurrentMonthKey() {

    const now =
        new Date();


    return (

        now.getFullYear() +

        "-" +

        String(
            now.getMonth() + 1
        ).padStart(2, "0")

    );

}


/* ==========================================================
   TAMPILKAN TARIF
========================================================== */

function showRate() {

    electricityRateEl.textContent =
        formatRupiah(
            electricityRate
        );

}


/* ==========================================================
   UPDATE TAGIHAN
========================================================== */

function updateCurrentBill() {

    const key =
        getCurrentMonthKey();


    const energy =
        Number(
            monthlyData[key] || 0
        );


    const bill =
        energy *
        electricityRate;


    monthlyEnergyEl.textContent =
        energy.toFixed(3);


    monthlyBillEl.textContent =
        formatRupiah(bill);


    electricityRateEl.textContent =
        formatRupiah(
            electricityRate
        );

}


/* ==========================================================
   TAMPILKAN TARIF DI INPUT
==========================================================

   PERHATIAN:

   Fungsi ini HANYA dipanggil ketika halaman pertama
   dibuka.

   Tidak dipanggil ketika MQTT masuk.
   Tidak dipanggil setiap detik.
   Tidak dipanggil ketika diagram diperbarui.
========================================================== */

function loadRateInput() {

    rateInput.value =
        String(
            electricityRate
        );

}


/* ==========================================================
   SIMPAN TARIF
========================================================== */

saveRateButton.addEventListener(
    "click",
    function () {


        const value =
            Number(
                rateInput.value
            );


        if (
            !Number.isFinite(value) ||
            value <= 0
        ) {

            rateMessage.textContent =
                "Tarif tidak valid.";

            rateMessage.style.color =
                "#EF4444";

            return;

        }


        /*
           SIMPAN TARIF BARU
        */

        electricityRate =
            value;


        localStorage.setItem(
            "electricityRate",
            String(electricityRate)
        );


        /*
           UPDATE TAMPILAN
        */

        showRate();

        updateCurrentBill();


        /*
           UPDATE DIAGRAM
           hanya karena user memang menekan
           tombol Simpan Tarif.
        */

        updateChart();


        rateMessage.textContent =
            "Tarif berhasil disimpan.";


        rateMessage.style.color =
            "#10B981";


        console.log(
            "Tarif baru:",
            electricityRate
        );

    }
);


/* ==========================================================
   SIMPAN ENERGI MQTT
========================================================== */

function saveMonthlyEnergy(
    energy
) {


    if (
        !Number.isFinite(energy)
    ) {

        return;

    }


    const monthKey =
        getCurrentMonthKey();


    let startData;

    try {

        startData =
            JSON.parse(
                localStorage.getItem(
                    "monthlyEnergyStart"
                )
            ) || {};

    }
    catch {

        startData = {};

    }


    /*
       Energi awal bulan
    */

    if (
        startData[monthKey] === undefined
    ) {

        startData[monthKey] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );

    }


    const startEnergy =
        Number(
            startData[monthKey]
        );


    let usedEnergy =
        energy -
        startEnergy;


    /*
       Jika PZEM di-reset
    */

    if (
        usedEnergy < 0
    ) {

        startData[monthKey] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );


        usedEnergy = 0;

    }


    monthlyData[monthKey] =
        usedEnergy;


    localStorage.setItem(
        "monthlyElectricity",
        JSON.stringify(
            monthlyData
        )
    );


    /*
       Update angka tagihan.

       TIDAK mengubah rateInput.
    */

    updateCurrentBill();


    /*
       TIDAK memanggil updateChart().
       Diagram menunggu interval 5 menit.
    */

}


/* ==========================================================
   MQTT
========================================================== */

let mqttClient = null;


function connectMQTT() {

    if (
        typeof mqtt === "undefined"
    ) {

        console.error(
            "MQTT library tidak ditemukan."
        );

        return;

    }


    console.log(
        "BILL MQTT START"
    );


    mqttClient =
        mqtt.connect(
            MQTT_HOST,
            MQTT_OPTIONS
        );


    mqttClient.on(
        "connect",
        function () {

            console.log(
                "BILL MQTT CONNECTED"
            );


            mqttClient.subscribe(
                TOPIC_DATA,
                function (error) {

                    if (error) {

                        console.error(
                            "MQTT SUBSCRIBE ERROR:",
                            error
                        );

                    }
                    else {

                        console.log(
                            "SUBSCRIBED:",
                            TOPIC_DATA
                        );

                    }

                }
            );

        }
    );


    mqttClient.on(
        "message",
        function (
            topic,
            message
        ) {


            try {


                const data =
                    JSON.parse(
                        message.toString()
                    );


                console.log(
                    "BILL MQTT DATA:",
                    data
                );


                if (
                    data.energy !== undefined
                ) {

                    saveMonthlyEnergy(
                        Number(
                            data.energy
                        )
                    );

                }


            }
            catch (error) {

                console.error(
                    "MQTT JSON ERROR:",
                    error
                );

            }

        }
    );


    mqttClient.on(
        "error",
        function (error) {

            console.error(
                "MQTT ERROR:",
                error
            );

        }
    );


    mqttClient.on(
        "reconnect",
        function () {

            console.log(
                "MQTT RECONNECTING..."
            );

        }
    );


    mqttClient.on(
        "close",
        function () {

            console.log(
                "MQTT CLOSED"
            );

        }
    );

}


/* ==========================================================
   CHART
========================================================== */

let billChart = null;


/* ==========================================================
   UPDATE CHART
========================================================== */

function updateChart() {

    const canvas =
        document.getElementById(
            "monthlyBillChart"
        );


    if (!canvas) {

        return;

    }


    const labels = [];

    const values = [];


    const currentYear =
        new Date().getFullYear();


    for (
        let month = 0;
        month < 12;
        month++
    ) {


        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        const bill =
            energy *
            electricityRate;


        labels.push(
            monthNames[month]
        );


        values.push(
            bill
        );

    }


    /*
       Buat chart hanya sekali.
    */

    if (
        billChart === null
    ) {


        billChart =
            new Chart(
                canvas,
                {

                    type: "bar",


                    data: {

                        labels: labels,


                        datasets: [

                            {

                                label:
                                    "Tagihan Listrik",


                                data:
                                    values,


                                borderWidth: 1

                            }

                        ]

                    },


                    options: {

                        responsive: true,


                        animation: false,


                        scales: {

                            y: {

                                beginAtZero: true,


                                ticks: {

                                    callback:
                                    function (
                                        value
                                    ) {

                                        return formatRupiah(
                                            value
                                        );

                                    }

                                }

                            }

                        },


                        plugins: {

                            tooltip: {

                                callbacks: {

                                    label:
                                    function (
                                        context
                                    ) {

                                        return formatRupiah(
                                            context.raw
                                        );

                                    }

                                }

                            }

                        }

                    }

                }
            );


    }
    else {


        /*
           Chart yang sudah ada
           hanya mengganti datanya.

           Tidak destroy.
           Tidak membuat chart baru.
        */

        billChart.data.labels =
            labels;


        billChart.data.datasets[0].data =
            values;


        billChart.update(
            "none"
        );

    }

}


/* ==========================================================
   UPDATE DIAGRAM SETIAP 5 MENIT
========================================================== */

setInterval(
    function () {

        console.log(
            "UPDATE DIAGRAM - 5 MENIT"
        );


        updateChart();

    },
    300000
);


/* ==========================================================
   RIWAYAT
========================================================== */

function showHistory() {

    historyEl.innerHTML = "";


    const currentYear =
        new Date().getFullYear();


    let hasHistory = false;


    for (
        let month = 0;
        month < 12;
        month++
    ) {


        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        if (
            energy <= 0
        ) {

            continue;

        }


        hasHistory = true;


        const bill =
            energy *
            electricityRate;


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "statusItem";


        item.innerHTML =

            "<strong>" +

            monthNames[month] +

            "</strong>" +

            "<span>" +

            energy.toFixed(3) +

            " kWh — " +

            formatRupiah(
                bill
            ) +

            "</span>";


        historyEl.appendChild(
            item
        );

    }


    if (!hasHistory) {

        historyEl.innerHTML =
            "<p>Belum ada riwayat tagihan.</p>";

    }

}


/* ==========================================================
   JAM
========================================================== */

function updateClock() {

    clockEl.textContent =
        new Date().toLocaleTimeString(
            "id-ID"
        );

}


setInterval(
    updateClock,
    1000
);


/* ==========================================================
   KEMBALI
========================================================== */

backButton.addEventListener(
    "click",
    function () {

        window.location.href =
            "index.html";

    }
);


/* ==========================================================
   START
========================================================== */

window.addEventListener(
    "load",
    function () {


        /*
           Urutan awal:
        */


        loadRateInput();


        showRate();


        updateCurrentBill();


        showHistory();


        updateChart();


        updateClock();


        connectMQTT();


    }
);

</script>

</body>

</html>

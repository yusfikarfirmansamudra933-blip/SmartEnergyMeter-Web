<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tagihan Listrik Bulanan</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>

        <div>

            <h1>TAGIHAN LISTRIK</h1>

            <p>Diagram Tagihan Listrik Perbulan</p>

        </div>

        <div class="clockArea">

            <span id="clock">
                00:00:00
            </span>

        </div>

    </header>


    <!-- KEMBALI -->
    <section class="setting">

        <button
            type="button"
            onclick="window.location.href='index.html'">

            ← Kembali ke Dashboard

        </button>

    </section>


    <!-- RINGKASAN -->
    <section class="cards">

        <div class="card">

            <h3>Pemakaian Bulan Ini</h3>

            <h2 id="monthlyEnergy">
                0.000
            </h2>

            <p>kWh</p>

        </div>


        <div class="card">

            <h3>Estimasi Tagihan</h3>

            <h2 id="monthlyBill">
                Rp0
            </h2>

            <p>Bulan Ini</p>

        </div>


        <div class="card">

            <h3>Tarif Listrik</h3>

            <h2 id="electricityRate">
                Rp1.500
            </h2>

            <p>per kWh</p>

        </div>

    </section>


    <!-- ATUR TARIF -->
    <section class="setting">

        <h2>Atur Tarif Listrik</h2>

        <input
            id="rateInput"
            type="number"
            min="1"
            step="1"
            placeholder="Contoh: 1500">

        <button
            id="saveRateButton"
            type="button">

            Simpan Tarif

        </button>

        <p id="rateMessage"></p>

    </section>


    <!-- DIAGRAM -->
    <section class="chartCard">

        <h2>
            Diagram Tagihan Listrik Perbulan
        </h2>

        <p>
            Data diagram diperbarui setiap 5 menit.
        </p>

        <canvas id="monthlyBillChart"></canvas>

    </section>


    <!-- RIWAYAT -->
    <section class="chartCard">

        <h2>
            Riwayat Tagihan
        </h2>

        <div id="history"></div>

    </section>

</div>


<!-- ======================================================
     CHART.JS
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- ======================================================
     MQTT
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>


<script>

"use strict";


/* =========================================================
   MQTT
========================================================= */

const MQTT_HOST =
    "wss://l660c516.ala.eu-central-1.emqxsl.com:8084/mqtt";


const MQTT_OPTIONS = {

    username: "smartenergymeter",

    password: "12345678",

    reconnectPeriod: 3000,

    connectTimeout: 10000,

    clean: true

};


const TOPIC_DATA =
    "smartmeter/data";


let mqttClient = null;


/* =========================================================
   TARIF
========================================================= */

const DEFAULT_RATE = 1500;


/*
    Tarif hanya dibaca sekali ketika halaman dibuka.
*/

let electricityRate =
    Number(
        localStorage.getItem(
            "electricityRate"
        )
    );


if (
    !Number.isFinite(electricityRate) ||
    electricityRate <= 0
) {

    electricityRate =
        DEFAULT_RATE;

    localStorage.setItem(
        "electricityRate",
        electricityRate
    );

}


/* =========================================================
   DATA BULANAN
========================================================= */

let monthlyData =
    JSON.parse(
        localStorage.getItem(
            "monthlyElectricity"
        )
    ) || {};


/* =========================================================
   ELEMENT
========================================================= */

const monthlyEnergyEl =
    document.getElementById(
        "monthlyEnergy"
    );


const monthlyBillEl =
    document.getElementById(
        "monthlyBill"
    );


const electricityRateEl =
    document.getElementById(
        "electricityRate"
    );


const rateInput =
    document.getElementById(
        "rateInput"
    );


const saveRateButton =
    document.getElementById(
        "saveRateButton"
    );


const rateMessage =
    document.getElementById(
        "rateMessage"
    );


/* =========================================================
   BULAN
========================================================= */

const monthNames = [

    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"

];


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function formatRupiah(value)
{

    return new Intl.NumberFormat(
        "id-ID",
        {
            style: "currency",
            currency: "IDR",
            maximumFractionDigits: 0
        }
    ).format(value);

}


/* =========================================================
   BULAN SEKARANG
========================================================= */

function getCurrentMonthKey()
{

    const now =
        new Date();

    return (
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0")
    );

}


/* =========================================================
   UPDATE INFORMASI
========================================================= */

function updateCurrentBill()
{

    const key =
        getCurrentMonthKey();


    const energy =
        Number(
            monthlyData[key] || 0
        );


    const bill =
        energy *
        electricityRate;


    monthlyEnergyEl.textContent =
        energy.toFixed(3);


    monthlyBillEl.textContent =
        formatRupiah(
            bill
        );


    electricityRateEl.textContent =
        formatRupiah(
            electricityRate
        );

}


/* =========================================================
   SIMPAN TARIF
========================================================= */

function saveRate()
{

    /*
        Ambil nilai DARI INPUT.
        Tidak mengambil kembali nilai lama.
    */

    const value =
        Number(
            rateInput.value
        );


    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {

        rateMessage.textContent =
            "Tarif tidak valid.";

        rateMessage.style.color =
            "#EF4444";

        return;

    }


    /*
        Simpan tarif baru.
    */

    electricityRate =
        value;


    localStorage.setItem(
        "electricityRate",
        String(
            electricityRate
        )
    );


    /*
        Update tampilan.
    */

    electricityRateEl.textContent =
        formatRupiah(
            electricityRate
        );


    updateCurrentBill();


    /*
        Update diagram SEKALI
        setelah tarif disimpan.
    */

    updateChart();


    showHistory();


    rateMessage.textContent =
        "Tarif berhasil disimpan: " +
        formatRupiah(
            electricityRate
        );


    rateMessage.style.color =
        "#10B981";


    console.log(
        "TARIF DISIMPAN:",
        electricityRate
    );

}


/* =========================================================
   TOMBOL TARIF
========================================================= */

saveRateButton.addEventListener(
    "click",
    saveRate
);


/* =========================================================
   CHART
========================================================= */

let billChart = null;


/* =========================================================
   MEMBUAT DATA CHART
========================================================= */

function getChartData()
{

    const labels = [];

    const values = [];

    const currentYear =
        new Date().getFullYear();


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        const bill =
            energy *
            electricityRate;


        labels.push(
            monthNames[month]
        );


        values.push(
            bill
        );

    }


    return {
        labels,
        values
    };

}


/* =========================================================
   BUAT CHART
========================================================= */

function createChart()
{

    const canvas =
        document.getElementById(
            "monthlyBillChart"
        );


    if (!canvas)
        return;


    const chartData =
        getChartData();


    billChart =
        new Chart(
            canvas,
            {

                type: "bar",

                data:
                {

                    labels:
                        chartData.labels,

                    datasets:
                    [

                        {

                            label:
                                "Tagihan Listrik",

                            data:
                                chartData.values,

                            borderWidth: 1

                        }

                    ]

                },


                options:
                {

                    responsive: true,

                    maintainAspectRatio: false,

                    animation: false,


                    scales:
                    {

                        y:
                        {

                            beginAtZero: true,

                            ticks:
                            {

                                callback:
                                function(value)
                                {

                                    return formatRupiah(
                                        value
                                    );

                                }

                            }

                        }

                    },


                    plugins:
                    {

                        tooltip:
                        {

                            callbacks:
                            {

                                label:
                                function(context)
                                {

                                    return formatRupiah(
                                        context.raw
                                    );

                                }

                            }

                        }

                    }

                }

            }
        );

}


/* =========================================================
   UPDATE CHART

   PENTING:
   Chart TIDAK dihancurkan dan dibuat ulang.

   Hanya data yang diganti.

========================================================= */

function updateChart()
{

    if (!billChart)
        return;


    const chartData =
        getChartData();


    billChart.data.labels =
        chartData.labels;


    billChart.data.datasets[0].data =
        chartData.values;


    /*
        Update tanpa animasi.
        Ini mencegah diagram berkedip.
    */

    billChart.update(
        "none"
    );


    console.log(
        "DIAGRAM DIPERBARUI:",
        new Date().toLocaleTimeString()
    );

}


/* =========================================================
   RIWAYAT
========================================================= */

function showHistory()
{

    const history =
        document.getElementById(
            "history"
        );


    if (!history)
        return;


    history.innerHTML = "";


    const currentYear =
        new Date().getFullYear();


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const key =
            currentYear +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const energy =
            Number(
                monthlyData[key] || 0
            );


        const bill =
            energy *
            electricityRate;


        if (energy <= 0)
            continue;


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "statusItem";


        item.innerHTML =
            "<strong>" +
            monthNames[month] +
            "</strong>" +

            "<span>" +
            energy.toFixed(3) +
            " kWh — " +
            formatRupiah(
                bill
            ) +
            "</span>";


        history.appendChild(
            item
        );

    }


    if (
        history.innerHTML === ""
    ) {

        history.innerHTML =
            "<p>Belum ada riwayat tagihan.</p>";

    }

}


/* =========================================================
   SIMPAN ENERGI DARI MQTT
========================================================= */

function saveEnergyFromMQTT(
    energy
)
{

    if (
        !Number.isFinite(energy)
    ) {

        console.error(
            "Energi MQTT tidak valid:",
            energy
        );

        return;

    }


    const key =
        getCurrentMonthKey();


    /*
        Data energi awal bulan.
    */

    let startData =
        JSON.parse(
            localStorage.getItem(
                "monthlyEnergyStart"
            )
        ) || {};


    /*
        Jika belum ada titik awal,
        simpan energi PZEM saat ini.
    */

    if (
        startData[key] === undefined
    ) {

        startData[key] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );

    }


    const startEnergy =
        Number(
            startData[key]
        );


    let usedEnergy =
        energy -
        startEnergy;


    /*
        Jika PZEM di-reset.
    */

    if (
        usedEnergy < 0
    ) {

        startData[key] =
            energy;


        localStorage.setItem(
            "monthlyEnergyStart",
            JSON.stringify(
                startData
            )
        );


        usedEnergy = 0;

    }


    monthlyData[key] =
        usedEnergy;


    localStorage.setItem(
        "monthlyElectricity",
        JSON.stringify(
            monthlyData
        )
    );


    console.log(
        "ENERGI BULANAN:",
        key,
        usedEnergy,
        "kWh"
    );


    /*
        Update kartu dan riwayat.
    */

    updateCurrentBill();

    showHistory();


    /*
        JANGAN updateChart() di sini.

        Karena MQTT bisa mengirim data
        setiap detik.

        Diagram akan diperbarui
        oleh timer 5 menit.
    */

}


/* =========================================================
   MQTT CONNECT
========================================================= */

function connectMQTT()
{

    console.log(
        "=== BILL MQTT START ==="
    );


    if (
        typeof mqtt === "undefined"
    ) {

        console.error(
            "MQTT.js tidak ditemukan."
        );

        return;

    }


    mqttClient =
        mqtt.connect(
            MQTT_HOST,
            MQTT_OPTIONS
        );


    mqttClient.on(
        "connect",
        function()
        {

            console.log(
                "=== BILL MQTT CONNECTED ==="
            );


            mqttClient.subscribe(
                TOPIC_DATA,
                function(error)
                {

                    if (error) {

                        console.error(
                            "MQTT SUBSCRIBE ERROR:",
                            error
                        );

                        return;

                    }


                    console.log(
                        "SUBSCRIBED:",
                        TOPIC_DATA
                    );

                }
            );

        }
    );


    mqttClient.on(
        "message",
        function(
            topic,
            message
        )
        {

            try {

                const data =
                    JSON.parse(
                        message.toString()
                    );


                console.log(
                    "BILL MQTT DATA:",
                    data
                );


                if (
                    data.energy !== undefined
                ) {

                    saveEnergyFromMQTT(
                        Number(
                            data.energy
                        )
                    );

                }

            }
            catch(error)
            {

                console.error(
                    "MQTT JSON ERROR:",
                    error
                );

            }

        }
    );


    mqttClient.on(
        "error",
        function(error)
        {

            console.error(
                "BILL MQTT ERROR:",
                error
            );

        }
    );


    mqttClient.on(
        "reconnect",
        function()
        {

            console.log(
                "BILL MQTT RECONNECTING..."
            );

        }
    );


    mqttClient.on(
        "close",
        function()
        {

            console.log(
                "BILL MQTT CLOSED"
            );

        }
    );

}


/* =========================================================
   JAM
========================================================= */

function updateClock()
{

    const clock =
        document.getElementById(
            "clock"
        );


    if (!clock)
        return;


    clock.textContent =
        new Date()
            .toLocaleTimeString(
                "id-ID"
            );

}


/* =========================================================
   UPDATE DIAGRAM SETIAP 5 MENIT
========================================================= */

/*
    5 menit = 300.000 ms

    Chart TIDAK diperbarui setiap detik.

    MQTT tetap berjalan normal.

    Yang diperbarui setiap 5 menit
    hanya diagram.
*/

const CHART_UPDATE_INTERVAL =
    5 * 60 * 1000;


setInterval(
    function()
    {

        console.log(
            "=== 5 MENIT ==="
        );


        /*
            Baca ulang localStorage
            supaya data terbaru masuk
            ke diagram.
        */

        monthlyData =
            JSON.parse(
                localStorage.getItem(
                    "monthlyElectricity"
                )
            ) || {};


        /*
            Tarif juga dibaca ulang
            hanya saat interval chart.
        */

        const storedRate =
            Number(
                localStorage.getItem(
                    "electricityRate"
                )
            );


        if (
            Number.isFinite(
                storedRate
            ) &&
            storedRate > 0
        ) {

            electricityRate =
                storedRate;

        }


        updateChart();

        updateCurrentBill();

        showHistory();

    },
    CHART_UPDATE_INTERVAL
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    function()
    {

        /*
            Isi input SATU KALI.
        */

        rateInput.value =
            electricityRate;


        updateCurrentBill();

        showHistory();

        createChart();

        updateClock();

        connectMQTT();

    }
);


/* =========================================================
   JAM SETIAP DETIK

   Ini HANYA untuk jam.
   Bukan untuk diagram.
========================================================= */

setInterval(
    updateClock,
    1000
);

</script>

</body>

</html>
